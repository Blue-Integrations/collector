[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netflow-collector"
version = "0.1.1"
description = "NetFlow collector, scanner detector, and MikroTik blocker with a web portal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
    "paramiko>=3.5.0",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
collector = "collector.__main__:main"

[tool.setuptools.packages.find]
include = ["collector*"]

[tool.setuptools.package-data]
collector = ["templates/*", "static/*"]
